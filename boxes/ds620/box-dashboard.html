<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Box Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Box Health Dashboard - generic, kein Branding */

  :root {
    --bg: #0a0a0a;
    --fg: #ffffff;
    --muted: #6b7280;
    --silver: #B0B7BC;
    --accent-1: #1a4d7a;
    --accent-2: #2d8fa1;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top right, rgba(26,77,122,0.4) 0%, transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(45,143,161,0.18) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    height: 100vh;
    width: 100vw;
    display: grid;
    grid-template-columns: minmax(360px, 38%) 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "hero   checks"
      "footer footer";
    padding: 12px 16px;
    gap: 12px;
  }

  /* HEADER */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 8px;
    border-bottom: 1px solid var(--card-border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: -0.5px;
    box-shadow: 0 2px 8px rgba(45,143,161,0.3);
  }

  .brand-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--silver);
    line-height: 1.4;
  }

  .brand-text strong {
    color: #fff;
    font-weight: 900;
    display: block;
    font-size: 13px;
    letter-spacing: 0.06em;
  }

  .timestamp {
    font-size: 11px;
    font-family: "JetBrains Mono", "Consolas", monospace;
    color: var(--muted);
    text-align: right;
    line-height: 1.5;
  }

  .timestamp strong {
    color: var(--silver);
    font-weight: 700;
    display: block;
  }

  /* HERO */
  .hero {
    grid-area: hero;
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s ease;
  }

  .hero[data-status="ok"]   { border-color: rgba(16,185,129,0.5); }
  .hero[data-status="warn"] { border-color: rgba(245,158,11,0.5); }
  .hero[data-status="err"]  { border-color: rgba(239,68,68,0.6); }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, currentColor 0%, transparent 65%);
    opacity: 0.1;
    pointer-events: none;
  }

  .hero[data-status="ok"]   { color: var(--ok); }
  .hero[data-status="warn"] { color: var(--warn); }
  .hero[data-status="err"]  { color: var(--err); }

  .hero-icon {
    font-size: 96px;
    line-height: 1;
    filter: drop-shadow(0 0 32px currentColor);
    margin-bottom: 4px;
    font-weight: 900;
  }

  .hero-text {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 0.06em;
    color: #fff;
    text-transform: uppercase;
    line-height: 1.05;
  }

  .hero-sub {
    font-size: 12px;
    color: var(--muted);
    font-family: "JetBrains Mono", monospace;
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  /* CHECKS */
  .checks {
    grid-area: checks;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: min-content;
    gap: 8px;
    overflow-y: auto;
    align-content: start;
  }

  .check {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    min-height: 56px;
  }

  .check[data-status="ok"]   { border-left: 3px solid var(--ok); }
  .check[data-status="warn"] { border-left: 3px solid var(--warn); border-color: rgba(245,158,11,0.25); }
  .check[data-status="err"]  { border-left: 3px solid var(--err); border-color: rgba(239,68,68,0.35); animation: pulse-err 2s ease-in-out infinite; }

  @keyframes pulse-err {
    0%, 100% { background: var(--card); }
    50% { background: rgba(239,68,68,0.1); }
  }

  .check-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .check[data-status="ok"]   .check-dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .check[data-status="warn"] .check-dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .check[data-status="err"]  .check-dot { background: var(--err); box-shadow: 0 0 10px var(--err); }

  .check-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .check-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--silver);
  }

  .check-msg {
    font-size: 10px;
    color: var(--muted);
    font-family: "JetBrains Mono", monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .check-value {
    font-size: 13px;
    font-weight: 700;
    font-family: "JetBrains Mono", monospace;
    color: #fff;
    text-align: right;
    white-space: nowrap;
  }

  /* FOOTER */
  footer {
    grid-area: footer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 0;
    border-top: 1px solid var(--card-border);
    font-size: 10px;
    font-family: "JetBrains Mono", monospace;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .footer-brand {
    color: var(--silver);
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  /* No-data state */
  .nodata {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }

  .nodata h2 {
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--err);
  }

  /* Hochformat-Fallback */
  @media (orientation: portrait) {
    .container {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr auto;
      grid-template-areas:
        "header"
        "hero"
        "checks"
        "footer";
    }
    .checks {
      grid-template-columns: 1fr;
    }
    .hero-icon { font-size: 56px; }
    .hero-text { font-size: 22px; }
  }

  @media (max-height: 600px) {
    .hero-icon { font-size: 72px; }
    .hero-text { font-size: 24px; }
    .check { min-height: 48px; padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="brand">
      <div class="brand-mark" id="brandInitial">B</div>
      <div class="brand-text">
        <strong id="brandTitle">Box</strong>
        Status Tower
      </div>
    </div>
    <div class="timestamp">
      <strong id="ts">-</strong>
      <span id="hostname">-</span>
    </div>
  </header>

  <div class="hero" id="hero" data-status="warn">
    <div class="hero-icon" id="heroIcon">...</div>
    <div class="hero-text" id="heroText">LADE STATUS</div>
    <div class="hero-sub" id="heroSub">Watchdog gestartet?</div>
  </div>

  <div class="checks" id="checks">
    <div class="nodata">
      <h2>Noch keine Daten</h2>
      <p>Stelle sicher, dass <code>box-watchdog.ps1</code> laeuft.</p>
    </div>
  </div>

  <footer>
    <span id="footerLeft">Box Status</span>
    <span class="footer-brand" id="footerRight">v1.0 - Ctrl+Shift+Q exit</span>
  </footer>

</div>

<script>
  const POLL_MS = 5000;
  const STATUS_JS = 'box-status.js';

  const labels = {
    internet:     'Internet',
    bonjour:      'mDNS / Bonjour',
    anydesk:      'Fernwartung',
    print_server: 'Print Server',
    printer:      'Drucker',
    ghosts:       'Geister',
    ribbon:       'Druckerrolle',
    ipad_in_lan:  'iPad im LAN'
  };

  const order = ['internet', 'bonjour', 'anydesk', 'print_server', 'printer', 'ghosts', 'ribbon', 'ipad_in_lan'];

  function reloadStatus() {
    return new Promise((resolve, reject) => {
      const old = document.getElementById('statusScript');
      if (old) old.remove();

      const s = document.createElement('script');
      s.id = 'statusScript';
      s.src = STATUS_JS + '?t=' + Date.now();
      s.onload = () => resolve(window.BOX_STATUS);
      s.onerror = () => reject(new Error('Konnte ' + STATUS_JS + ' nicht laden'));
      document.head.appendChild(s);
    });
  }

  function render(data) {
    if (!data) return;

    document.getElementById('ts').textContent = data.timestamp_de || '';
    const host = data.hostname || '';
    document.getElementById('hostname').textContent = host;
    document.getElementById('brandTitle').textContent = host || 'Box';
    if (host) {
      document.getElementById('brandInitial').textContent = host[0].toUpperCase();
    }
    document.getElementById('footerLeft').textContent = host ? host + ' Status' : 'Box Status';

    const hero = document.getElementById('hero');
    const heroIcon = document.getElementById('heroIcon');
    const heroText = document.getElementById('heroText');
    const heroSub  = document.getElementById('heroSub');

    hero.dataset.status = data.overall;
    if (data.overall === 'ok') {
      heroIcon.textContent = 'OK';
      heroText.textContent = 'BOX BEREIT';
      heroSub.textContent  = 'alle Checks gruen - ' + (data.check_duration_ms || 0) + ' ms';
    } else if (data.overall === 'warn') {
      heroIcon.textContent = '!';
      heroText.textContent = 'AUFMERKSAMKEIT';
      const warnCount = Object.values(data.checks).filter(c => c.status === 'warn').length;
      heroSub.textContent  = warnCount + ' Warnung' + (warnCount === 1 ? '' : 'en') + ' aktiv';
    } else {
      heroIcon.textContent = 'X';
      heroText.textContent = 'NICHT BEREIT';
      const errCount = Object.values(data.checks).filter(c => c.status === 'err').length;
      heroSub.textContent  = errCount + ' kritische' + (errCount === 1 ? 'r Fehler' : ' Fehler');
    }

    const wrap = document.getElementById('checks');
    wrap.innerHTML = '';
    for (const key of order) {
      const c = data.checks[key];
      if (!c) continue;
      const div = document.createElement('div');
      div.className = 'check';
      div.dataset.status = c.status;
      div.innerHTML = `
        <span class="check-dot"></span>
        <div class="check-body">
          <div class="check-label">${labels[key] || key}</div>
          <div class="check-msg">${c.message || ''}</div>
        </div>
        <div class="check-value">${c.value || ''}</div>
      `;
      wrap.appendChild(div);
    }
  }

  async function tick() {
    try {
      const data = await reloadStatus();
      render(data);
    } catch (e) {
      const hero = document.getElementById('hero');
      hero.dataset.status = 'err';
      document.getElementById('heroIcon').textContent = 'X';
      document.getElementById('heroText').textContent = 'KEIN HEARTBEAT';
      document.getElementById('heroSub').textContent  = 'Watchdog laeuft nicht - manuell starten';
    }
  }

  tick();
  setInterval(tick, POLL_MS);

  // Click in Mitte: in Fullscreen wechseln
  document.body.addEventListener('click', (e) => {
    // Klicks in der oberen rechten Ecke (Exit-Trigger) NICHT als Fullscreen-Trigger
    const inExitCorner = (e.clientX > window.innerWidth - 80 && e.clientY < 80);
    if (inExitCorner) return;
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  });

  // ESC-Taste: Fullscreen verlassen (klappt bei normalem Fullscreen)
  document.addEventListener('keydown', (e) => {
    // Ctrl+Shift+Q: kompletter Exit (auch im Edge-Kiosk-Modus)
    if (e.ctrlKey && e.shiftKey && (e.key === 'Q' || e.key === 'q')) {
      e.preventDefault();
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      window.close();
    }
    // ESC: Fullscreen verlassen
    if (e.key === 'Escape' && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  });

  // 5x Tap/Click in obere rechte Ecke innerhalb 3s -> Exit-Trigger
  // Nuetzlich auf Touchscreens ohne Tastatur
  let exitTaps = [];
  document.addEventListener('click', (e) => {
    const inExitCorner = (e.clientX > window.innerWidth - 80 && e.clientY < 80);
    if (!inExitCorner) return;
    const now = Date.now();
    exitTaps = exitTaps.filter(t => now - t < 3000);
    exitTaps.push(now);
    if (exitTaps.length >= 5) {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      // Visual feedback
      document.body.style.filter = 'invert(1)';
      setTimeout(() => { document.body.style.filter = ''; }, 200);
      exitTaps = [];
    }
  });
</script>
</body>
</html>
